name: ci
on: [push]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # PLANTED: the check's exit status is thrown away by tee (no pipefail) — a red check would read as green.
      - run: node check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
