app = "broberg-legal"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # F110.13 — cold: no machine runs while nobody asks; the first request starts
  # one. Owner 1/11 2026: «Jeg GIDER ikke spilde penge på unødvendig luksus».
  # Deploy with --ha=false: ONE machine.
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
