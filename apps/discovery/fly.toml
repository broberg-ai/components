app = "broberg-discovery"
primary_region = "arn"

# F105.5 — the Dockerfile sits beside this file while the build context is the
# repo root. The deploy workflow passes --dockerfile; the image-hygiene engine
# (written by cardmem, app + config only) reads it from here. Relative to this file.
[build]
  dockerfile = "Dockerfile"

# Read by exactly one thing in this app: @broberg/logger's `pretty` flag. Unset,
# the server emitted the human-readable format in production — fine to read, but
# not queryable by a log tool, which is most of the reason to use a logger rather
# than console.log. Verified before setting it that nothing else in server.ts or
# the installed package branches on NODE_ENV.
[env]
  NODE_ENV = "production"
  # F038.23 — people sign in with BrobergID (client "discovery", public + PKCE,
  # registered by broberg-id 8/10). SSO_COOKIE_SECRET is a Fly secret.
  BID_ISSUER = "https://id.broberg.ai"
  SSO_CLIENT_ID = "discovery"
  SSO_REDIRECT_URI = "https://discovery.broberg.ai/auth/callback"
  SSO_POST_LOGOUT_REDIRECT_URI = "https://discovery.broberg.ai/"
  # BrobergID subjects allowed in (comma-separated). A BID account alone is not
  # access. Christian's sub, as bound by pitch (F053) — never his email.
  DISCOVERY_ALLOWED_SUBS = "i7luja5HkacmowtPnc9UVNnpa2IXoF2y"
  # F038.29 — the ticket registry is read live from BID (BID d54b54e). The
  # ticket must be FOR BID: audience "bid" (BID's own name in its registry),
  # scope tickets:registry:read, principal svc:broberg-discovery.
  BID_TICKET_REGISTRY_URL = "https://id.broberg.ai/api/tickets/registry"
  BID_TICKET_REGISTRY_AUDIENCE = "bid"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
