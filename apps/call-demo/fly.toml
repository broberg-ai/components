# F104.9.6 — call-demo: password-protected test page (owner's GO 2/11 2026 «GO med adgangskode»).
# Cold when unused: the first visit starts the machine.
app = "broberg-call-demo"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
