# F104.2 — rendered by entrypoint.sh. Keys come from the LIVEKIT_KEYS secret
# ("<key>: <secret>", one per app), never from this file.
port: 7880
logging:
  level: info

rtc:
  tcp_port: 7881          # ICE over TCP when UDP is blocked (raw TCP through Fly)
  udp_port: 7882          # single UDP mux port (Fly needs external port == internal)
  use_external_ip: false  # STUN discovery would find Fly's shared egress, not our IP
  node_ip: __PUBLIC_IP__  # the dedicated IPv4 clients must send media to
  ips:
    includes:
      - __FGS_IP__/32
  turn_servers:
    - host: broberg-voice-turn.fly.dev
      port: 443
      protocol: tls
      secret: __TURN_SECRET__
    - host: broberg-voice-turn.fly.dev
      port: 3478
      protocol: udp
      secret: __TURN_SECRET__

# F104.5 — TURN lives in its own app (broberg-voice-turn, turn.broberg.ai) so
# it can have port 443 to itself: a network that only lets 443 out can still
# call. LiveKit's embedded TURN is off; clients get short-lived credentials
# for the external one, minted from the shared secret (never stored here).
# Host is the app's fly.dev name until turn.broberg.ai exists in DNS (same IPs,
# Fly's own certificate) — switch to turn.broberg.ai once its cert is issued.
turn:
  enabled: false

room:
  empty_timeout: 300
  max_participants: 20
