name: discovery

# GATE + DEPLOY for Discovery — the surface every repo in the fleet is told to
# read BEFORE building anything.
#
# THREE DIFFERENT CLAIMS, ONE PER CHECK. Stating them here because conflating
# two of them is the mistake this file's header itself made until 2026-08-29:
#
#   check / roster-vs-npm     THIS REPO agrees with NPM          (F038.10)
#   check / docs-not-stale    THE PAGES agree with this repo
#   live-fresh                THE LIVE SITE agrees with this repo (F038.6)
#   live-fresh / featured     the LIVE hero card names npm's newest (F038.7)
#
# Only the first and last ask the registry anything. Without them the pipeline
# can be perfectly self-consistent and perfectly wrong — which is exactly what
# happened when @broberg/notifications 0.3.0 shipped and the roster was not
# bumped: the site matched the repo, both were behind, and live-fresh went green.
#
# F038.6 — WHY THE LAST JOB EXISTS, measured twice:
#   · 2026-08-14  `check` was GREEN (the repo was self-consistent) while the live
#     site had served four stale versions for three days. Nothing deployed it. A
#     self-consistent repo and a correct site are different claims.
#   · 2026-08-15  flyctl printed "WARNING The app is not listening on the expected
#     address" and then reported SUCCESS. A step trusting the exit code would have
#     gone green on that output.
# So the run does not end on a deploy succeeding. It ends on the fleet's own
# endpoint agreeing with the repo.
on:
  push:
    branches: [main]
  pull_request:
  # A RELEASE must refresh Discovery too, not only an edit to the roster file.
  # Christian: "hver gang du releaser en ny version af dine komponenter så bliver
  # Discovery også automatisk opdateret". Publishing and remembering to bump the
  # roster are two acts, and the second one is the one that gets forgotten — so
  # the release itself is a trigger.
  #
  # WHICH JOB CATCHES A FORGOTTEN ROSTER BUMP — corrected 2026-08-29 after
  # measuring it, because this comment said `live-fresh` and that is FALSE.
  # `live-fresh` compares the LIVE SITE against THIS REPO, so a roster nobody
  # bumped leaves those two agreeing and the job goes green while the fleet is
  # told the old version. What actually caught it was `check`: the hero card is
  # generated from NPM, so publishing changed the generated HTML, the committed
  # copy went stale, and the deploy was BLOCKED — better than a red at the end,
  # since no stale site ever shipped.
  #
  # AND THAT ONLY WORKS FOR THE NEWEST RELEASE. Publish a patch to a package that
  # is not the newest on npm and the hero card does not move, nothing asks npm
  # about that row, and live-fresh goes green on a stale roster. See F038.10.
  workflow_run:
    workflows: [publish]
    types: [completed]
  workflow_dispatch:

jobs:
  check:
    # A publish that FAILED must not gate-and-deploy off the back of it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # A cc session's `grep` skips some text files SILENTLY (no match, exit 1,
      # no error), so every grep-based sweep over them is falsely green. It is
      # not the system grep — it is the harness's shim, which passes -I. Both a
      # NUL byte and any non-UTF-8 encoding trigger it, so a Danish file saved as
      # latin-1 is invisible too. This job already runs on every push, so the
      # guard lives here rather than in a workflow of its own.
      # F068.1 — the published package, not the local script, so this repo is its
      # own first consumer and a break in what the fleet installs shows up here
      # rather than only in someone else's repo. Pinned exactly: a guard that
      # silently changed its predicate under us is the failure this package exists
      # to prevent.
      - name: Every tracked text file is greppable
        run: npx --yes @broberg/greppable@0.3.0

      # F038.8 — this job ALREADY failed on a file that does not parse, but only
      # by side effect: a broken source cannot regenerate, so the step below
      # errored and the job went red for a reason nobody chose. A refactor that
      # made the generators tolerate a bad load would remove that coverage
      # silently, and nothing would announce it. So the check is explicit, it
      # runs FIRST, and it names its own cause — the trap has now bitten twice
      # and both times it was a straight quote inside a double-quoted desc.
      - name: The single source parses
        run: |
          for f in scripts/inventory-data.mjs scripts/build-inventory.mjs scripts/build-onboarding.mjs; do
            if ! node --check "$f" 2>/tmp/syntax.err; then
              echo "::error file=$f::$f does not parse. Most likely a straight double quote inside a double-quoted desc field — the desc string is delimited by \", so a \" inside it ends the string early. Use a curly quote, or drop the quotes."
              cat /tmp/syntax.err
              exit 1
            fi
          done
          echo "All three parse."

      # F038.10 — THE ONE DIRECTION NOTHING ELSE COVERED.
      #
      #   this step   the repo agrees with NPM
      #   the step below + the next one   the pages agree with the repo
      #   live-fresh  the live site agrees with the repo
      #
      # The last two prove the pipeline is consistent with itself. Neither can
      # see a roster that is simply WRONG — and a wrong roster is the failure
      # with victims, because every repo's CLAUDE.md sends sessions here before
      # they build anything.
      #
      # It gates the DEPLOY on purpose (this job is what `deploy` needs): shipping
      # a roster we already know is stale publishes the wrong answer to the fleet.
      #
      # EXIT 2 IS NOT A FAILURE HERE. npm being unreachable is not our defect, and
      # a hard red on it would let an outage at the registry block every push in
      # this repo. It is loud, it is a distinct message, and it is never silent —
      # which is the whole of the F038.9 lesson. Same three-outcome shape already
      # used for @broberg/cron's contract-drift check (see test.yml).
      - name: The roster names what npm actually serves
        run: |
          set +e
          node scripts/check-roster-versions.mjs
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "::warning::Could not reach the npm registry for some rows — those were NOT verified. Nothing was found wrong in the rows that did answer."
            exit 0
          fi
          exit $code

      - name: Regenerate the surfaces from the single source
        run: |
          bun scripts/build-inventory.mjs
          bun scripts/build-onboarding.mjs

      - name: Fail if the committed docs are stale
        run: |
          if ! git diff --quiet -- docs/inventory.html docs/onboarding.html docs/llms.txt docs/llms-full.txt; then
            echo "::error::Discovery docs are stale vs scripts/inventory-data.mjs — run: bun scripts/build-inventory.mjs && bun scripts/build-onboarding.mjs, then commit docs/."
            git --no-pager diff --stat -- docs/
            exit 1
          fi
          echo "Discovery docs are in sync with the single source."

  # DOES THIS PUSH ACTUALLY CHANGE WHAT DISCOVERY SERVES?
  #
  # `check` runs on every push — the greppable guard and the parse check are
  # cheap and belong everywhere. The DEPLOY must not. A push that touches only a
  # package's src/ changes nothing the site serves, and deploying anyway would
  # make the deploy count meaningless as a signal and spend a build for nothing.
  #
  # A release is the exception and is why `workflow_run` skips this: publishing
  # a package IS a change to what the fleet should install, even when this repo's
  # Discovery files did not move. (A forgotten roster bump is caught by `check`,
  # not by `live-fresh` — see the correction in the header.)
  changes:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.f.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: f
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} — deploying regardless of paths."
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED" | sed 's/^/    /'
          if echo "$CHANGED" | grep -Eq '^(scripts/inventory-data\.mjs|scripts/build-.*\.mjs|scripts/npm-latest\.mjs|apps/discovery/|docs/(inventory|onboarding)\.html|docs/llms.*\.txt|\.github/workflows/(inventory-fresh|fly-server-deploy)\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing Discovery serves changed — not deploying."
          fi

  # THE DEPLOY IS GATED ON THE CHECK, not merely ordered after it: `needs` means
  # a red gate blocks the ship. And it is the repo's OWN reusable workflow
  # (F033.7), not a second hand-rolled deploy path.
  deploy:
    needs: [check, changes]
    if: needs.changes.outputs.relevant == 'true'
    uses: ./.github/workflows/fly-server-deploy.yml
    with:
      app: broberg-discovery
      # THE BUILD CONTEXT IS THE REPO ROOT while the config lives in the app dir.
      # The Dockerfile COPYs scripts/inventory-data.mjs, so running from
      # apps/discovery fails with a not-found on a file that is right there. This
      # cost a manual deploy attempt on 2026-08-15; the three inputs below are the
      # whole reason that is not a trap any more.
      working_directory: "."
      config: apps/discovery/fly.toml
      dockerfile: apps/discovery/Dockerfile
      health_url: https://discovery.broberg.ai/api
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # The run does not end on a successful deploy — see the header.
  live-fresh:
    needs: [changes, deploy]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: The live roster serves what the repo says
        run: bun scripts/check-live-fresh.mjs https://discovery.broberg.ai

      # F038.10 — this guard was written for F038.7, hardened for F038.9, and had
      # NEVER RUN IN CI: it appeared in no workflow and in no npm script. A guard
      # nobody has watched fail is not a gate; this one had not even been watched
      # pass. Pointed at the LIVE url, which is the thing it was built to check —
      # its own header says a local file cannot prove a deploy landed.
      - name: The "Just shipped" card on the LIVE site names the newest release
        run: bun scripts/check-featured-fresh.mjs https://discovery.broberg.ai
