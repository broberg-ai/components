name: secret-gate

# F090 — THE FLEET'S SECRET GATE. Every repo calls this one workflow, so the
# rules and the self-test live in exactly one place.
#
#   # .github/workflows/secret-gate.yml in YOUR repo
#   name: secret-gate
#   on: [push, pull_request]
#   jobs:
#     secret-gate:
#       uses: broberg-ai/components/.github/workflows/secret-gate.yml@secret-gate-v1
#
# Make your deploy/merge job `needs: secret-gate` (or mark it required in
# branch protection): a finding must BLOCK, not just turn a badge red.
#
# WHY IT EXISTS (cms F201.16, 2026-09-30): a Discord webhook sat in a public
# repo for six months. cms ran gitleaks the whole time and it said "no leaks" —
# its config lacked `[extend] useDefault = true`, which REPLACES gitleaks' rules
# with none. So this gate does two things, in this order:
#   1. proves it can find planted fakes (secret-gate/selftest.sh) — a gate that
#      cannot find anything must not be allowed to report a repo clean;
#   2. scans the caller's FULL history with the shared config.
#
# A known false positive: add its fingerprint (printed in the finding) to a
# `.gitleaksignore` in your repo root. gitleaks reads it automatically, and it
# is a reviewable line rather than a silenced rule.

on:
  workflow_call:
    inputs:
      gate-ref:
        description: Ref of broberg-ai/components the shared config is read from. Keep it equal to the tag you pinned `uses:` to.
        type: string
        default: secret-gate-v1

permissions:
  contents: read

jobs:
  secret-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's own
      # checksums file. A changed binary is refused, not run.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout the shared config
        uses: actions/checkout@v4
        with:
          repository: broberg-ai/components
          ref: ${{ inputs.gate-ref }}
          path: .secret-gate
          sparse-checkout: secret-gate
          persist-credentials: false

      - name: Install gitleaks (pinned + sha256-verified)
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Self-test — the gate must find planted fakes
        run: .secret-gate/secret-gate/selftest.sh gitleaks .secret-gate/secret-gate/gitleaks.toml

      - name: Scan full history
        run: |
          set -euo pipefail
          # --redact: a finding prints file, line, commit and rule, never the value.
          gitleaks git . \
            --config .secret-gate/secret-gate/gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json"

      - name: Keep the (redacted) report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
