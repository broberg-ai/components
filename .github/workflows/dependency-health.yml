name: dependency-health
# F082.5 — Christian 23/10 2026: «Kører du nogle CI / Cronjobs for at checke om
# alle vores dependencies er OK for samtlige pakker? Det skal du også gøre.»
# Weekly (and whenever the lockfile changes): known vulnerabilities and outdated
# dependencies for every published @broberg package. The result is committed as
# data/dependency-health.json and shown on discovery.broberg.ai/packages and in
# llms.txt. «Could not check» is recorded as such, never as a clean result.
on:
  schedule:
    # Mondays 01:37 UTC = 02:37/03:37 Danish time (night, Christian's 02–05 window).
    - cron: "37 1 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "scripts/dependency-health.mjs"
      - ".github/workflows/dependency-health.yml"

concurrency:
  group: dependency-health
  cancel-in-progress: false

permissions:
  contents: write
  # To start the Discovery deploy: a GITHUB_TOKEN push starts no workflow (F038.33).
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check every package
        run: node scripts/dependency-health.mjs --out data/dependency-health.json
      - name: Say what was found
        run: |
          node -e '
            const r = require("./data/dependency-health.json");
            const rows = Object.entries(r.packages);
            const bad = rows.filter(([, x]) => x.verdict === "sårbar");
            const err = rows.filter(([, x]) => x.status === "error");
            console.log(`${rows.length} packages · ${bad.length} vulnerable · ${err.length} could not be checked`);
            for (const [n, x] of bad) console.log(`::warning::${n} — ${x.prod.critical} critical, ${x.prod.high} high in what it ships`);
            for (const [n, x] of err) console.log(`::warning::${n} — could not check: ${x.error}`);
          '
      - name: Commit when the result changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "dependency-health"
          git config user.email "noreply@broberg.ai"
          # /packages shows checked_at as «tjekket»: a scheduled or manual run always
          # commits, so a quiet week still shows THIS week's check. A lockfile push
          # only commits when the result changed (checked_at stripped).
          strip='let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);delete j.checked_at;console.log(JSON.stringify(j))}catch{console.log("")}})'
          BEFORE=$(git show HEAD:data/dependency-health.json 2>/dev/null | node -e "$strip" || echo "")
          AFTER=$(node -e "$strip" < data/dependency-health.json)
          if [ "${{ github.event_name }}" = "push" ] && [ "$BEFORE" = "$AFTER" ]; then echo "no change"; exit 0; fi
          node scripts/build-onboarding.mjs
          # pnpm install armed .githooks; its secret gate refuses to commit until the
          # scanner (and its workspace dependency) is built. Build it, never bypass it.
          pnpm turbo run build --filter="@broberg/secret-scan..."
          git add data/dependency-health.json docs/llms.txt docs/llms-full.txt
          git commit -m "chore(deps): refresh the dependency health of every package" -m "Automated by .github/workflows/dependency-health.yml (F082.5)."
          git pull --rebase origin main
          git push
          gh workflow run inventory-fresh.yml --ref main
