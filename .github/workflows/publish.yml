      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }

      # <slug>-v<semver>  ->  @broberg/<slug> and <semver>. One shape for all 39
      # tag prefixes, so a new package needs no edit here.
      - name: Derive the package and version from the tag
        id: t
        run: |
          TAG="${GITHUB_REF_NAME}"
          SLUG="${TAG%-v*}"
          VER="${TAG##*-v}"
          if [ -z "$SLUG" ] || [ -z "$VER" ] || [ "$SLUG" = "$TAG" ]; then
            echo "::error::tag '$TAG' is not <slug>-v<version> — refusing to guess."
            exit 1
          fi
          echo "pkg=@broberg/$SLUG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "::notice::roster bump target: @broberg/$SLUG@$VER"

      # WAIT FOR THE REGISTRY, don't race it. A green publish job, a registry
      # document, and an installable version land minutes apart; bumping on the
      # first would name a version a consumer cannot yet resolve.
      #
      # 15 minutes, not 5. This job needs only `gate`, so its clock starts while
      # the package's own publish job is still building — measured 28/10 twice
      # (mail 0.21.0, sso 0.23.1): npm served the version ~7½ min after this
      # step began, the 5-minute wait gave up, the roster stayed behind, and the
      # next Discovery run went red on main until someone bumped it by hand.
      - name: Wait until npm actually serves it
        run: |
          for i in $(seq 1 60); do
            if npm view "${{ steps.t.outputs.pkg }}@${{ steps.t.outputs.ver }}" version >/dev/null 2>&1; then
              echo "npm serves ${{ steps.t.outputs.pkg }}@${{ steps.t.outputs.ver }}"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::npm did not serve ${{ steps.t.outputs.pkg }}@${{ steps.t.outputs.ver }} within 15 minutes — not bumping. check-roster-versions will catch it on the next Discovery run."
          echo "SKIP=1" >> "$GITHUB_ENV"

      # TWO PACKAGES CAN RELEASE AT ONCE, and then two roster jobs race for the
      # same branch: both check out the same main, both commit, and the second
      # push is rejected as non-fast-forward. Losing that push loses exactly the
      # bump this card exists to guarantee.
      #
      # So each attempt RE-DERIVES from a freshly fetched main rather than
      # rebasing a commit built on a stale one — the regenerated docs/ would
      # conflict line-for-line with the other job's, and a rebase conflict in CI
      # is a silent no-bump wearing a red X. Re-running is safe because the bump
      # is idempotent: on a roster already naming this version it changes
      # nothing and exits 0.
      - name: Bump the roster, regenerate, and land it
        if: env.SKIP != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main

            # THREE OUTCOMES, NOT TWO. Bare under `bash -e` an exit 2 — the
            # registry unreachable, which is not a verdict on anything — would
            # fail this job identically to exit 1, which IS one. That collapse
            # is the same defect F038.15 fixed one workflow over.
            set +e
            node scripts/bump-roster-version.mjs "${{ steps.t.outputs.pkg }}" "${{ steps.t.outputs.ver }}"
            code=$?
            set -e
            if [ "$code" = "2" ]; then
              echo "::warning::npm went unreachable between the wait and the bump — not bumping. check-roster-versions catches it on the next Discovery run."
              exit 0
            fi
            [ "$code" = "0" ] || exit "$code"

            bun scripts/build-inventory.mjs
            bun scripts/build-onboarding.mjs

            if git diff --quiet; then
              echo "::notice::roster already names ${{ steps.t.outputs.ver }} — nothing to commit."
              exit 0
            fi

            git add scripts/inventory-data.mjs docs/
            git commit -q -m "chore(roster): ${{ steps.t.outputs.pkg }} -> ${{ steps.t.outputs.ver }} (F038.16, by the release that published it)"
            if git push origin main; then
              echo "::notice::roster bumped on attempt $attempt."
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt) — another release landed first; re-deriving from the new main."
          done

          echo "::error::could not land the roster bump after 5 attempts. The release itself is fine; the roster row is behind and check-roster-versions will block the next Discovery deploy until it is fixed."
          exit 1
