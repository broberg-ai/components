      - name: Attach SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-secret-scan
          path: ${{ runner.temp }}/sbom.cdx.json

      # npm (not pnpm) does the OIDC token exchange + provenance. No NODE_AUTH_TOKEN.
      - name: Publish (OIDC)
        working-directory: packages/secret-scan
        run: npm publish --access public --provenance

      # F115.4 — prove it from the registry: SLSA provenance present and the
      # registry signatures valid on a clean install (npm audit signatures).
      # Red here means a version is live without proof — fix forward, never skip.
      - name: Verify provenance + signatures on the registry
        run: node scripts/verify-provenance.mjs "$(node -p "require('./packages/secret-scan/package.json').name")" "$(node -p "require('./packages/secret-scan/package.json').version")"

