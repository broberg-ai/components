name: publish

# Publishes @broberg/* packages to npm via OIDC Trusted Publishing — NO token/secret.
# One tag prefix per package:
#   • theme-v*        → packages/theme        → @broberg/theme
#   • secret-scan-v*  → packages/secret-scan  → @broberg/secret-scan
#   • seti-client-v*  → packages/seti-client  → @broberg/seti-client
#   • seti-server-v*  → packages/seti-server  → @broberg/seti-server
#   • mail-v*         → packages/mail         → @broberg/mail
#   • config-v*       → packages/config       → @broberg/config
#   • media-v*        → packages/media        → @broberg/media
#   • app-shell-v*    → packages/app-shell    → @broberg/app-shell
#   • sso-v*          → packages/sso          → @broberg/sso
#   • apikey-v*       → packages/apikey       → @broberg/apikey
#   • webpush-v*      → packages/webpush      → @broberg/webpush
#   • cron-v*         → packages/cron         → @broberg/cron
#   • media-transform-v* → packages/media-transform → @broberg/media-transform
#   • deploy-core-v*  → packages/deploy-core  → @broberg/deploy-core
#   • gravatar-v*     → packages/gravatar     → @broberg/gravatar
#   • auth-v*         → packages/auth         → @broberg/auth
#   • notify-v*       → packages/notify       → @broberg/notify
#   • logger-v*       → packages/logger       → @broberg/logger
#   • notifications-v* → packages/notifications → @broberg/notifications
#   • backup-v*       → packages/backup       → @broberg/backup
#   • provider-usage-v* → packages/provider-usage → @broberg/provider-usage
#   • bodymap-v*      → packages/bodymap      → @broberg/bodymap
#   • stripe-v*       → packages/stripe       → @broberg/stripe
#   • pwa-v*          → packages/pwa          → @broberg/pwa
#   • greppable-v*    → packages/greppable    → @broberg/greppable
#   • seal-v*         → packages/seal         → @broberg/seal
#   • mail-identity-v* → packages/mail-identity → @broberg/mail-identity
#   • legal-v*         → packages/legal         → @broberg/legal
#   • realtime-v*     → packages/realtime     → @broberg/realtime
#   • s3-v*           → packages/s3            → @broberg/s3
#   • mollie-v*       → packages/mollie        → @broberg/mollie
#   • call-v*         → packages/call         → @broberg/call (was @broberg/voice, F104.6)
#   • mail-templates-v* → packages/mail-templates → @broberg/mail-templates
#   • forms-turnstile-v* → packages/forms-turnstile → @broberg/forms-turnstile
#   • sms-v*         → packages/sms         → @broberg/sms
#   • tenant-v*      → packages/tenant      → @broberg/tenant
#   • data-table-v*  → packages/data-table  → @broberg/data-table
#   • settings-v*    → packages/settings    → @broberg/settings
#   • device-stats-v* → packages/device-stats → @broberg/device-stats
#   • feature-stats-v* → packages/feature-stats → @broberg/feature-stats
#   • chat-v*         → packages/chat         → @broberg/chat
#
# Each package has its own Trusted Publisher entry at npmjs.com → <pkg> → Trusted Publisher =
#   repository: broberg-ai/components · workflow: publish.yml · environment: (empty)
# npm matches on repo + workflow filename, so ALL @broberg/* publishes live in THIS file —
# add a parallel job + a tag prefix for each new package. v0.1.0 of each package is
# bootstrapped by hand (npm has no "pending publisher"); every publish after that runs here
# with zero secrets (OIDC + provenance). Each job only runs for its own tag prefix.
on:
  push:
    tags:
      - "theme-v*"
      - "secret-scan-v*"
      - "seti-client-v*"
      - "seti-server-v*"
      - "mail-v*"
      - "config-v*"
      - "media-v*"
      - "app-shell-v*"
      - "apikey-v*"
      - "webpush-v*"
      - "nativepush-v*"
      - "phone-v*"
      - "cron-v*"
      - "media-transform-v*"
      - "deploy-core-v*"
      - "gravatar-v*"
      - "auth-v*"
      - "mail-core-v*"
      - "speech-dictionary-v*"
      - "notify-v*"
      - "logger-v*"
      - "notifications-v*"
      - "backup-v*"
      - "provider-usage-v*"
      - "bodymap-v*"
      - "stripe-v*"
      - "pwa-v*"
      - "greppable-v*"
      - "seal-v*"
      - "mail-identity-v*"
      - "legal-v*"
      - "realtime-v*"
      - "call-v*"
      - "s3-v*"
      - "mollie-v*"
      - "mail-templates-v*"
      - "forms-turnstile-v*"
      - "mcp-v*"
      - "sms-v*"
      - "tenant-v*"
      - "data-table-v*"
      - "settings-v*"
      - "web-clipper-v*"
      - "livesync-v*"
      - "editor-v*"
      - "device-stats-v*"
      - "feature-stats-v*"
      - "chat-v*"
      - "cmdk-v*"
      - "consent-cookie-v*"
      - "event-log-v*"
      - "http-v*"
      - "local-guard-v*"
      - "i18n-v*"
      - "soundkit-v*"
      - "ui-controls-core-v*"
      - "sso-v*"
  workflow_dispatch:

jobs:
  # THE WORKSPACE GATE, AND EVERY PUBLISH JOB DEPENDS ON IT (F080.3).
  #
  # Before this existed, each publish-* job ran only its OWN package's tests, and
  # the workspace suite (`test.yml`) ran on branch pushes a tag never matches. So
  # a release could not see a red gate even in principle.
  #
  # Measured 2026-08-29: `test` had been failing for ELEVEN consecutive runs when
  # @broberg/notifications 0.3.0 was published, and nothing stopped it. Eleven
  # chances to notice, eleven missed — which is the honest measure of how much
  # attention an advisory red actually gets. A gate nothing depends on is a
  # notification.
  #
  # `uses:` rather than duplicated steps on purpose: the gate and the release it
  # guards must not be able to drift apart.
  gate:
    # security-events: read — test.yml's codeql-alerts job reads the CodeQL alerts of main (F115.2).
    # A called workflow can never hold more permission than its caller, so it has to be granted HERE.
    permissions:
      contents: read
      security-events: read
    uses: ./.github/workflows/test.yml

  publish-theme:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/theme-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15 # F033.15 — ~3× measured max; GitHub would otherwise wait 360
    permissions:
      contents: read
      id-token: write # lets GitHub mint the OIDC token npm exchanges for publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # resolves to >=22.14, required by OIDC publishing
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm CLI >= 11.5.1; node 22 still ships 10.x.
      # Pinned (not @latest): npm 12.0.0 (2026-07) ships a broken global install whose
      # provenance path can't resolve bundled `sigstore` → publish fails. 11.5.1 is good.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install (workspace)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/theme
        run: pnpm typecheck

      - name: Build
        working-directory: packages/theme
        run: pnpm build

      - name: Test
        working-directory: packages/theme
        run: pnpm test

      - name: Guard — tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/theme-v')
        working-directory: packages/theme
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#theme-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag theme-v$TAG does not match packages/theme version $PKG"
            exit 1
          fi

      - name: Guard — version not already on npm
        working-directory: packages/theme
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "@broberg/theme@$PKG" version >/dev/null 2>&1; then
            echo "::error::@broberg/theme@$PKG already published — bump the version first."
            exit 1
          fi
          echo "Publishing @broberg/theme@$PKG"

      # F115.4 / F115.8 — what is about to leave the house: the packed tarball is
      # audited for files that must never ship, and an SBOM of exactly what this
      # package ships is built from the lockfile and attached to the run.
      - name: Supply chain — tarball contents + SBOM
        run: |
          node scripts/check-tarball-contents.mjs packages/theme
          node scripts/gen-sbom.mjs packages/theme --out "$RUNNER_TEMP/sbom.cdx.json"

      - name: Attach SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-theme
          path: ${{ runner.temp }}/sbom.cdx.json

      # npm (not pnpm) does the OIDC token exchange + provenance. No NODE_AUTH_TOKEN.
      - name: Publish (OIDC)
        working-directory: packages/theme
        run: npm publish --access public --provenance

      # F115.4 — prove it from the registry: SLSA provenance present and the
      # registry signatures valid on a clean install (npm audit signatures).
      # Red here means a version is live without proof — fix forward, never skip.
      - name: Verify provenance + signatures on the registry
        run: node scripts/verify-provenance.mjs "$(node -p "require('./packages/theme/package.json').name")" "$(node -p "require('./packages/theme/package.json').version")"

  publish-secret-scan:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/secret-scan-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15 # F033.15 — ~3× measured max; GitHub would otherwise wait 360
    permissions:
      contents: read
      id-token: write # lets GitHub mint the OIDC token npm exchanges for publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # resolves to >=22.14, required by OIDC publishing
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm CLI >= 11.5.1; node 22 still ships 10.x.
      # Pinned (not @latest): npm 12.0.0 (2026-07) ships a broken global install whose
      # provenance path can't resolve bundled `sigstore` → publish fails. 11.5.1 is good.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install (workspace)
        run: pnpm install --frozen-lockfile

      # THE PACKAGE'S OWN SCRIPT IS `tsc --noEmit`, and `working-directory` means
      # pnpm runs exactly that — turbo is never invoked, so the task graph that
      # says typecheck needs `^build` is never consulted and no dependency is
      # ever built. Fixing turbo.json (which was also a real defect, and is also
      # fixed) left this half untouched: the workspace gate went green on main
      # while the release kept failing on the same line.
      #
      #   test/f035-14.test.ts(13,29): error TS2307:
      #     Cannot find module '@broberg/apikey'
      #
      # `^...` is "the dependencies OF this package, excluding itself". Verified
      # on the task graph rather than by re-running a release:
      #   turbo run build --filter="@broberg/secret-scan^..." --dry=json
      #   -> @broberg/apikey#build          (one task, not the package's own)
      #
      # secret-scan is the ONLY one of 40 packages with a `workspace:` dependency
      # today, which is exactly why scripts/check-workspace-dep-builds.mjs exists
      # — the SECOND one gets no warning otherwise. See F080.4.
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter="@broberg/secret-scan^..."

      - name: Typecheck
        working-directory: packages/secret-scan
        run: pnpm typecheck

      - name: Build
        working-directory: packages/secret-scan
        run: pnpm build

      - name: Test
        working-directory: packages/secret-scan
        run: pnpm test

      - name: Guard — tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/secret-scan-v')
        working-directory: packages/secret-scan
        run: |
          PKG=$(node -p "require('./package.json').version")
