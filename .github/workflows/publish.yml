    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/mail-core-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15 # F033.15 — ~3× measured max; GitHub would otherwise wait 360
    permissions:
      contents: read
      id-token: write # lets GitHub mint the OIDC token npm exchanges for publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # resolves to >=22.14, required by OIDC publishing
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm CLI >= 11.5.1; node 22 still ships 10.x.
      # Pinned (not @latest): npm 12.0.0 (2026-07) ships a broken global install whose
      # provenance path can't resolve bundled `sigstore` → publish fails. 11.5.1 is good.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install (workspace)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/mail-core
        run: pnpm typecheck

      - name: Build
        working-directory: packages/mail-core
        run: pnpm build

      - name: Test
        working-directory: packages/mail-core
        run: pnpm test

      - name: Guard — tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/mail-core-v')
        working-directory: packages/mail-core
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#mail-core-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag mail-core-v$TAG does not match packages/mail-core version $PKG"
            exit 1
          fi

      - name: Guard — version not already on npm
        working-directory: packages/mail-core
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "@broberg/mail-core@$PKG" version >/dev/null 2>&1; then
            echo "::error::@broberg/mail-core@$PKG already published — bump the version first."
            exit 1
          fi
          echo "Publishing @broberg/mail-core@$PKG"

      # F115.4 / F115.8 — what is about to leave the house: the packed tarball is
      # audited for files that must never ship, and an SBOM of exactly what this
      # package ships is built from the lockfile and attached to the run.
      - name: Supply chain — tarball contents + SBOM
        run: |
          node scripts/check-tarball-contents.mjs packages/mail-core
          node scripts/gen-sbom.mjs packages/mail-core --out "$RUNNER_TEMP/sbom.cdx.json"

      - name: Attach SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-mail-core
          path: ${{ runner.temp }}/sbom.cdx.json

      # npm (not pnpm) does the OIDC token exchange + provenance. No NODE_AUTH_TOKEN.
      - name: Publish (OIDC)
        working-directory: packages/mail-core
        run: npm publish --access public --provenance

      # F115.4 — prove it from the registry: SLSA provenance present and the
      # registry signatures valid on a clean install (npm audit signatures).
      # Red here means a version is live without proof — fix forward, never skip.
      - name: Verify provenance + signatures on the registry
        run: node scripts/verify-provenance.mjs "$(node -p "require('./packages/mail-core/package.json').name")" "$(node -p "require('./packages/mail-core/package.json').version")"

