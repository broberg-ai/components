# F110.11 — every visible service shows the CURRENT text of all five legal documents from
# legal.broberg.ai. The owner's definition of done for F110 (31 Oct 2026): «Din opgave er først
# 100% færdig … når ALLE vores synlige services anvender dette API til data for de 5 dokumenter.»
# Red names each service and document that is missing, hand-written, edited or out of date.
# Exit 2 (legal.broberg.ai unreadable) is not a verdict on any service.
name: legal-pages

on:
  schedule:
    - cron: "37 6 * * *" # daily, 06:37 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check every visible service's legal pages against legal.broberg.ai
        run: node scripts/check-legal-pages.mjs docs/legal/visible-services.json
