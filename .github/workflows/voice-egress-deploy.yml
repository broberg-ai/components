# F104.9.2 — broberg-voice-egress is deployed ONLY through the fleet's shared
# fly-server-deploy.yml: counted machines, one machine, verified. No code tests
# here (the image is upstream's plus a config template); the workflow's own
# Machine-plan / Machine-verify are the gate. A deploy interrupts a running recording, so it
# runs only when this app's own files change, or by hand.
name: voice-egress-deploy
on:
  push:
    branches: [main]
    paths:
      - "apps/voice-egress/**"
      - ".github/workflows/voice-egress-deploy.yml"
  workflow_dispatch:
concurrency:
  group: deploy-broberg-voice-egress
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    uses: ./.github/workflows/fly-server-deploy.yml
    with:
      app: broberg-voice-egress
      working_directory: apps/voice-egress
      config: fly.toml
      ha: false # one recording machine; control starts and stops it
      expected_machines: 1
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_VOICE_EGRESS }} # app-scoped deploy token (F033.24)
