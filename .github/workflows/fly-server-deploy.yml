name: fly-server-deploy

# F033.7 — fleet-shared, REUSABLE "deploy a server app to Fly" workflow.
#
# The CALLER owns the test gate (a `deploy` job with `needs: test`) and calls
# this reusable workflow, which does the DEPLOY half:
#   ship-dark guard -> optional host build -> flyctl deploy --remote-only
#   -> health-verify (prove it serves 200) -> optional required-secrets check.
#
# Usage in a consumer repo (.github/workflows/ci.yml):
#
#   jobs:
#     test:
#       runs-on: ubuntu-latest
#       steps: [ ... your tests ... ]
#     deploy:
#       needs: test
#       uses: broberg-ai/components/.github/workflows/fly-server-deploy.yml@main
#       with:
#         app: my-app
#         health_url: https://my-app.fly.dev/health
#       secrets:
#         FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
#
# F033.10 — IF YOUR APP KEEPS ITS DATA IN A FILE ON A FLY VOLUME, READ THIS:
#
#   `flyctl deploy` runs the app on TWO machines by default. An app whose
#   database is a file on one attached volume cannot be run twice — the second
#   machine either cannot take the volume or the pair write over each other.
#   There is no error and no failed deploy. The job goes green and the data is
#   wrong. So:
#
#       with:
#         ha: false                       # one machine
#         health_commit_path: .commit     # prove the NEW build is answering
#
#   You do not have to remember this: if your fly.toml declares `[mounts]` and
#   `ha` is still true, this workflow REFUSES to deploy and tells you which
#   input to set. `ha` defaults to true, so nothing changes for an app that
#   really is stateless.
#
#   `health_commit_path` is a jq path to whatever your health endpoint reports
#   as its commit. Without it, health-verify accepts the first HTTP 200 — and if
#   the new release failed to boot, THE OLD VERSION IS STILL SERVING 200. With
#   it, the poll continues until the sha this run deployed is the one answering.
#   (That needs the F033.8 consumer half: `ARG GIT_SHA` + `ENV GIT_SHA=$GIT_SHA`
#   in your Dockerfile, and your app reporting it.)
#
#   `extra_deploy_args` is an escape hatch for flags this workflow has no input
#   for. It sits beside the typed inputs, not instead of them. Never put a
#   secret in it — the deploy command is echoed to the log.
#
# Ship-dark: with no FLY_API_TOKEN the deploy is SKIPPED (job stays green) — a
# fork/PR without the secret never red-fails. The token is only ever read via
# env, never interpolated into a shell command.
#
# GIT_SHA (F033.8): every deploy is built with `--build-arg GIT_SHA=<7-char sha>`,
# so an app can report WHICH version it is running to a deploy-register.
#
#   A BUILD-ARG IS BUILD-TIME ONLY. Passing it does not put anything in the
#   running container. If you want the sha at runtime, YOUR Dockerfile must
#   declare and forward it — this workflow cannot do that half for you:
#
#       ARG GIT_SHA=unknown
#       ENV GIT_SHA=$GIT_SHA
#
#   Skip those two lines and your app boots with no sha and reports "unknown" —
#   which a register accepts, writes once, and (being idempotent on deploy_id)
#   can then never correct. A wrong row that reads as a healthy report.
#
#   Declaring nothing is safe: a Dockerfile without `ARG GIT_SHA` builds fine
#   when the arg is passed (measured: exit 0, Docker only warns). So this is
#   unconditional and needs no opt-in.

on:
  workflow_call:
    inputs:
      app:
        description: Fly app name (overrides the fly.toml app when set).
        required: false
        type: string
        default: ""
      config:
        description: Path to the Fly config file.
        required: false
        type: string
        default: fly.toml
      dockerfile:
        description: Path to the Dockerfile (optional; fly.toml build.dockerfile wins when unset).
        required: false
        type: string
        default: ""
      working_directory:
        description: Directory to run from (where fly.toml lives).
        required: false
        type: string
        default: "."
      build_command:
        description: >
          Optional host/CI build to run BEFORE deploy. Use it to build a
          Vite/esbuild dist on the runner and COPY it in your Dockerfile, since
          Fly's remote builder can't run esbuild (EPIPE). Empty = skip.
        required: false
        type: string
        default: ""
      build_runtime:
        description: 'Runtime to set up for build_command: none | node | bun.'
        required: false
        type: string
        default: none
      node_version:
        description: Node version when build_runtime = node.
        required: false
        type: string
        default: "22"
      bun_version:
        description: Bun version when build_runtime = bun (e.g. "1.1.34"; "latest" = newest).
        required: false
        type: string
        default: latest
      health_url:
        description: >
          URL polled for HTTP 200 after deploy — proves it serves, not just that
          deploy returned. Empty = skip health-verify.
        required: false
        type: string
        default: ""
      health_timeout:
        description: Seconds to wait for health_url to return 200.
        required: false
        type: number
        default: 120
      health_commit_path:
        description: >
          jq path to the commit the app reports on health_url (e.g. `.commit`).
          When set, health-verify keeps polling until the SHA THIS RUN DEPLOYED
          answers — a 200 from the version that was already running does NOT
          satisfy it. Empty = accept any 200 (old behaviour).
        required: false
        type: string
        default: ""
      ha:
        description: >
          Run the app on Fly's default TWO machines. Set false for an app whose
          data is a FILE on a single attached volume — two writers on one volume
          is silent corruption, not an error. Default true so existing consumers
          are unchanged.
        required: false
        type: boolean
        default: true
      extra_deploy_args:
        description: >
          Extra arguments appended to `flyctl deploy`. An escape hatch BESIDE
          the typed inputs, not instead of them. Word-split, so multiple args
          work. Never put a secret here — the deploy command is echoed.
        required: false
        type: string
        default: ""
      required_secrets:
        description: >
          Comma-separated Fly secret NAMES that must exist on the app (checked
          via `flyctl secrets list`). Values are never printed. Empty = skip.
        required: false
        type: string
        default: ""
      region:
        description: Expected primary region (advisory log only; house default arn).
        required: false
        type: string
        default: arn
    secrets:
      FLY_API_TOKEN:
        description: Fly deploy token. Absent = deploy skipped (ship-dark).
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Ship-dark guard (no token, no deploy)
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN not set — skipping deploy (ship-dark)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deploy target region (advisory): ${{ inputs.region }}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip == 'false' && inputs.build_runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup Bun
        if: steps.guard.outputs.skip == 'false' && inputs.build_runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Host build (Fly remote-builder esbuild workaround)
        if: steps.guard.outputs.skip == 'false' && inputs.build_command != ''
        run: ${{ inputs.build_command }}

      - name: Setup flyctl
        if: steps.guard.outputs.skip == 'false'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Required-secrets presence check
        if: steps.guard.outputs.skip == 'false' && inputs.required_secrets != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          REQUIRED_SECRETS: ${{ inputs.required_secrets }}
        run: |
          APP_ARG=""
          [ -n "$APP" ] && APP_ARG="--app $APP"
          # F033.9 — two states, not one. "flyctl could not answer" and "flyctl
          # answered and the secret is absent" are different facts, and only the
          # second one is about secrets. This used to swallow stderr and read an
          # empty listing as "every required secret is missing", so an EXPIRED
          # TOKEN was reported as missing secrets — sending you off to set
          # secrets that were already there, with the real cause discarded.
          # Names only — flyctl secrets list never prints values.
          if ! LISTING="$(flyctl secrets list $APP_ARG 2>&1)"; then
            echo "$LISTING"
            echo "::error::Could not READ the secrets on the app — flyctl failed to authenticate or reach it (its own error is printed above). This says NOTHING about which secrets are set. Check FLY_API_TOKEN (expired? wrong org scope?) and the app name before you touch a single secret."
            exit 1
          fi
          PRESENT=" $(echo "$LISTING" | awk 'NR>1 {print $1}' | tr '\n' ' ') "
          MISSING=""
          IFS=',' read -ra NEED <<< "$REQUIRED_SECRETS"
          for raw in "${NEED[@]}"; do
            n="$(echo "$raw" | xargs)"
            [ -z "$n" ] && continue
            case "$PRESENT" in
              *" $n "*) : ;;
              *) MISSING="$MISSING $n" ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing Fly secrets on the app:$MISSING — set them with 'flyctl secrets set' (values never printed)."
            exit 1
          fi
          echo "All required secrets present."

      - name: Single-writer guard (a volume + two machines is silent data loss)
        if: steps.guard.outputs.skip == 'false'
        env:
          CONFIG: ${{ inputs.config }}
          HA: ${{ inputs.ha }}
        run: |
          # F033.10 — `flyctl deploy` runs the app on TWO machines by default.
          # An app whose database is a FILE on one attached volume cannot be run
          # twice: the second machine either cannot take the volume or the pair
          # write over each other. There is no error and no failed deploy — the
          # job goes green and the data is wrong.
          #
          # An `ha` input ALONE would only help someone who already knows this,
          # which is exactly not the person about to hit it. The fly.toml we were
          # handed already says whether there is a volume, so we read it.
          if [ ! -r "$CONFIG" ]; then
            # TWO STATES, NOT ONE (the form F033.8 and F033.9 were both about):
            # "there is no [mounts] section" and "I could not look" are different
            # facts. A guard that reports success because it never ran is worse
            # than no guard, so this says so out loud instead of passing quietly.
            echo "::notice::Single-writer check SKIPPED — no readable config at '$CONFIG'. This did NOT verify that the app is safe to run on two machines; it means the check could not look."
            exit 0
          fi
          # A real TOML section header, not the substring "mounts" — so a
          # commented-out `# [mounts]` or the word inside another value cannot
          # trigger a stop people would then route around.
          if grep -Eq '^[[:space:]]*\[\[?mounts\]\]?' "$CONFIG"; then
            if [ "$HA" != "false" ]; then
              echo "::error::$CONFIG declares a [mounts] volume, so this app keeps its data in a file on ONE disk — but the deploy would start TWO machines. Two writers on one volume corrupts data silently: no error, no failed deploy, a green job and wrong data. Set the workflow input 'ha: false' to deploy a single machine. (If you really do want two, this app must not keep state on a local volume.)"
              exit 1
            fi
            echo "✓ [mounts] found and ha=false — deploying a single machine."
          else
            echo "✓ No [mounts] in $CONFIG — no single-writer constraint."
          fi

      - name: Deploy (flyctl --remote-only)
        if: steps.guard.outputs.skip == 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          CONFIG: ${{ inputs.config }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          HA: ${{ inputs.ha }}
          EXTRA_DEPLOY_ARGS: ${{ inputs.extra_deploy_args }}
        run: |
          APP_ARG=""; [ -n "$APP" ] && APP_ARG="--app $APP"
          DF_ARG=""; [ -n "$DOCKERFILE" ] && DF_ARG="--dockerfile $DOCKERFILE"
          # F033.10 — only ha:false adds a flag. The default composes the exact
          # same command as before this input existed, so no existing consumer
          # changes behaviour by upgrading.
          HA_ARG=""; [ "$HA" = "false" ] && HA_ARG="--ha=false"
          # F033.8 — stamp the build with the commit so a deploy-register can say WHICH
          # version shipped. 7 chars, matching `git rev-parse --short HEAD`, so a CI deploy
          # and a local ship of the same commit produce ONE id, not two rows for one release.
          SHA="${GITHUB_SHA:0:7}"
          set -x
          # EXTRA_DEPLOY_ARGS is deliberately unquoted so multiple arguments split
          # into separate words rather than arriving as one blob.
          flyctl deploy --remote-only --config "$CONFIG" $APP_ARG $DF_ARG $HA_ARG --build-arg GIT_SHA="$SHA" $EXTRA_DEPLOY_ARGS

      - name: Health-verify (prove the NEW version serves 200)
        if: steps.guard.outputs.skip == 'false' && inputs.health_url != ''
        env:
          HEALTH_URL: ${{ inputs.health_url }}
          HEALTH_TIMEOUT: ${{ inputs.health_timeout }}
          HEALTH_COMMIT_PATH: ${{ inputs.health_commit_path }}
        run: |
          # F033.10 — a plain 200 does not prove the deploy worked. If the new
          # release failed to boot, the OLD version is still answering 200, so
          # this step used to go green on the thing that was already there.
          # With HEALTH_COMMIT_PATH we keep polling until the sha THIS RUN
          # deployed is the one answering (F033.8 stamps it into the build).
          SHA="${GITHUB_SHA:0:7}"
          if [ -n "$HEALTH_COMMIT_PATH" ]; then
            echo "Polling $HEALTH_URL until it serves commit $SHA at '$HEALTH_COMMIT_PATH' (up to ${HEALTH_TIMEOUT}s)…"
          else
            echo "Polling $HEALTH_URL for HTTP 200 (up to ${HEALTH_TIMEOUT}s)…"
          fi
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT ))
          # Three outcomes get three DIFFERENT messages. Collapsing them is how
          # F033.9 sent someone to fix secrets that were already set.
          last_reason="never returned 200"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            resp=$(curl -s --max-time 10 -w $'\n%{http_code}' "$HEALTH_URL" || printf '\n000')
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            if [ "$code" = "200" ]; then
              if [ -z "$HEALTH_COMMIT_PATH" ]; then
                echo "✓ 200 from $HEALTH_URL — deploy proven healthy."
                exit 0
              fi
              served=$(printf '%s' "$body" | jq -r "$HEALTH_COMMIT_PATH // empty" 2>/dev/null || true)
              if [ -z "$served" ]; then
                last_reason="answered 200 but reported NO commit at '$HEALTH_COMMIT_PATH'"
                echo "  … 200, but no commit at '$HEALTH_COMMIT_PATH', retrying in 5s"
              elif [ "${served:0:7}" = "$SHA" ]; then
                # Normalised to 7 chars so an app reporting the full sha and one
                # reporting the short form both match — same choice as F033.8.
                echo "✓ $HEALTH_URL serves commit $served — the NEW version is live."
                exit 0
              else
                last_reason="answered 200 while still serving commit ${served} (expected ${SHA}) — the OLD version is up; the new one did not take over"
                echo "  … 200 from commit $served, waiting for $SHA, retrying in 5s"
              fi
            else
              last_reason="never returned 200"
              echo "  … got $code, retrying in 5s"
            fi
            sleep 5
          done
          echo "::error::$HEALTH_URL — deploy NOT proven healthy within ${HEALTH_TIMEOUT}s: ${last_reason}."
          exit 1
