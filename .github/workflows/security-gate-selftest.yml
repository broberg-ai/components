name: security-gate-selftest
# F427.1 — the fleet security gate must be able to FAIL. This runs the REAL engine (scripts/security-gate/run-check.mjs,
# the same code path security-gate.yml runs) with the REAL pinned tools against fixtures with one planted finding per
# check, and requires each to go red BY NAME; the clean fixture must be green; the ack rules must hold end to end.
# A gate nobody has watched fail is not a gate. Runs on every change to the engine, and weekly (a tool update or a
# changed rule pack must not quietly stop finding things).
on:
  push:
    branches: [main]
    paths:
      - "scripts/security-gate/**"
      - "scripts/dependency-health.mjs"
      - "security-gate/**"
      - ".github/workflows/security-gate.yml"
      - ".github/workflows/security-gate-selftest.yml"
  pull_request:
    paths:
      - "scripts/security-gate/**"
      - "security-gate/**"
      - ".github/workflows/security-gate*.yml"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
# `bash` (not the default `bash -e`) runs with -o pipefail: `check | tee summary` must FAIL when the check fails.
defaults:
  run:
    shell: bash
concurrency:
  group: security-gate-selftest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The WORKFLOW itself, not just the engine script: the reusable security-gate.yml run on the clean fixture, through
  # the same checkout / tool-install / run-check glue every repo gets, must come out green. (The first end-to-end run of
  # the tagged workflow, 20/11 2026, came out green on a repo with findings because of a `| tee` — see
  # scripts/check-workflow-pipes.mjs. This job proves the glue runs the real checks and passes a clean tree; the
  # `security-gate-e2e-red` run on components itself proves it fails a dirty one.)
  workflow-on-clean-fixture:
    permissions:
      contents: read
    uses: ./.github/workflows/security-gate.yml
    with:
      engine-ref: ${{ github.sha }}
      directory: security-gate/fixtures/clean
      exclude: ""

  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.3" }
      - name: pnpm (pinned, no install scripts)
        run: npm install -g pnpm@10.30.3 --ignore-scripts --no-audit --no-fund
      - name: The tools, at the versions security-gate.yml pins
        run: pip install --no-cache-dir --require-hashes --no-deps -r security-gate/requirements/semgrep.txt -r security-gate/requirements/zizmor.txt
      - name: The engine's one dependency
        run: npm install yaml@2.8.1 --ignore-scripts --no-audit --no-fund --no-save --no-package-lock
      - name: Pure decisions (unit tests)
        run: node scripts/test-security-gate.mjs
      - name: Every check goes red by name; the clean fixture is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/security-gate/selftest.mjs | tee -a "$GITHUB_STEP_SUMMARY"
