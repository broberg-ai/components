name: codeql
# F115.2 — static analysis (CodeQL, security-extended) for every package, app and
# example. Runs on push to main, on PRs and weekly (a query pack improves on
# GitHub's timetable, not ours). Alerts land in the Security tab; a release is
# blocked by an open high/critical alert (scripts/check-codeql-alerts.mjs).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
