# F115.3 — automatic dependency updates. Dependabot opens PRs; nothing auto-merges.
# Every PR runs test.yml and every gate (release-advisories, action pins, pnpm
# hardening) like any other change. Security updates are on at repo level too.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/packages/*", "/examples/*", "/apps/*"]
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Copenhagen }
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3
  # The security-gate selftest fixtures hold PLANTED vulnerable dependencies (lodash 4.17.15, flatmap-stream). Bumping
  # them would break the selftest, so no Dependabot pull request — version or security — may be opened for them.
  - package-ecosystem: npm
    directories: ["/security-gate/fixtures/*"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  # F115.9 — the same for the Rust and Swift fixtures (smallvec 0.6.9, swift-nio 2.40.0 are PLANTED, like lodash above): the gate
  # reads them as vulnerable on purpose, and a bump would turn the selftest green for the wrong reason.
  - package-ecosystem: cargo
    directories: ["/security-gate/fixtures/*"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: swift
    directories: ["/security-gate/fixtures/*"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "05:30", timezone: Europe/Copenhagen }
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
